[project]
name = "backend"
version = "0.1.0"
description = "Campaign CRM backend - FastAPI + SQLAlchemy 2.0 + Pydantic v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "fastapi>=0.118",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.37",
]

[project.scripts]
campaign-crm = "backend.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.11",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Autogenerated by `alembic revision`; not ours to style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
