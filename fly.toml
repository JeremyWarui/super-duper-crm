app = "mzigo-crm"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Migrations run on every deploy, before the new machine takes traffic.
# The reference seed is not here: 27,273 centres take longer than a release
# command should, so it is a one-off over `flyctl ssh console`.
[deploy]
  release_command = "alembic upgrade head"

[env]
  STATIC_DIR = "/app/static"
  # The SPA is served from this same origin, so no browser origin is allowed in.
  CORS_ALLOW_ORIGINS = "[]"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Suspended when idle, billing its rootfs rather than its CPU. Fly resumes a
  # suspended machine in well under a second, so the link still answers fast.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
