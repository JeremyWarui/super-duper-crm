app = "mzigo-crm"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Migrates before the new machine takes traffic. Seed once with
# `flyctl ssh console -C "campaign-crm seed"`.
[deploy]
  release_command = "alembic upgrade head"

[env]
  STATIC_DIR = "/app/static"
  # The SPA is served from this origin.
  CORS_ALLOW_ORIGINS = "[]"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
