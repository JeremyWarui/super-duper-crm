name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Scanner tests
        run: python -m unittest discover -s tools/secret-scan -v
      - name: Scan every tracked file
        run: python tools/secret-scan/scan.py --all
      - name: Scan every commit this push or pull request adds
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD"
          else
            echo "No earlier commit to compare with; the tracked-file scan covers the tip."
            exit 0
          fi
          python tools/secret-scan/scan.py --history "$range"
