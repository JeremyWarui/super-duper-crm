<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobilizer app — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5D3B}a:hover{color:#08442B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Public Sans', system-ui, sans-serif; color: #13201A; background: #F7F7F5; display: flex; flex-direction: column; overflow: hidden">

<header style="background: #0B5D3B; color: #FFFFFF; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 600; color: #CFE0D5">[Candidate] for MP · Mobilizer</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">[Ward 4]</h1>
<span style="font-size: 14px; color: #CFE0D5">Target this week: <strong style="color: #F2B705">[000]</strong> households</span>
</header>

<main style="flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<section aria-labelledby="ev-h" style="background: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; border: 1px solid #E9E9E5">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0B5D3B">Today · [Time]</span>
<h2 id="ev-h" style="margin: 0; font-size: 19px; font-weight: 700">[Baraza at market grounds]</h2>
<span style="font-size: 14px; color: #4E5552">Invited: [000]</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; background: #F7F7F5; border-radius: 14px; padding: 10px">
<button type="button" aria-label="Decrease attended" onClick="{{dec}}" style="width: 52px; height: 52px; border-radius: 12px; border: 1px solid #D3D5D3; background: #FFFFFF; font: inherit; font-size: 26px; font-weight: 700; cursor: pointer">−</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">{{count}}</span>
<span style="font-size: 13px; color: #4E5552; font-weight: 600">attended</span>
</div>
<button type="button" aria-label="Increase attended" onClick="{{inc}}" style="width: 52px; height: 52px; border-radius: 12px; border: 0; background: #0B5D3B; color: #FFFFFF; font: inherit; font-size: 26px; font-weight: 700; cursor: pointer">+</button>
</div>
<button type="button" style="font: inherit; font-weight: 700; font-size: 16px; min-height: 48px; border-radius: 999px; border: 0; background: #F2B705; color: #13201A; cursor: pointer">Save attendance</button>
<p style="margin: 0; font-size: 12px; color: #4E5552">Works offline — syncs when you have network.</p>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="font: inherit; text-align: left; background: #FFFFFF; border: 1px solid #E9E9E5; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-height: 104px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M19 8v6M16 11h6"></path></svg>
<span style="font-weight: 700; font-size: 15px">Register supporter</span>
</button>
<button type="button" style="font: inherit; text-align: left; background: #FFFFFF; border: 1px solid #E9E9E5; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-height: 104px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B5D3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
<span style="font-weight: 700; font-size: 15px">Log door visits</span>
</button>
</div>

<section aria-labelledby="next-h" style="background: #FFFFFF; border-radius: 18px; padding: 18px; border: 1px solid #E9E9E5; display: flex; flex-direction: column; gap: 10px">
<h2 id="next-h" style="margin: 0; font-size: 16px; font-weight: 700">Coming up</h2>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><span style="font-weight: 600">[Door-to-door, Block C]</span><span style="color: #4E5552">[Sat]</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><span style="font-weight: 600">[Party rally — ushering]</span><span style="color: #4E5552">[Sun]</span></div>
</section>
</main>

<nav aria-label="App" style="background: #FFFFFF; border-top: 1px solid #E9E9E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 4px 14px">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 700; color: #0B5D3B; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"></path></svg>Today</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; color: #4E5552; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; color: #4E5552; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path></svg>Supporters</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; font-weight: 600; color: #4E5552; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; }
  renderVals() {
    return {
      count: this.state.n,
      inc: () => this.setState({ n: this.state.n + 1 }),
      dec: () => this.setState({ n: Math.max(0, this.state.n - 1) })
    };
  }
}
</script>
</body>
</html>
