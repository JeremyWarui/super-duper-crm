<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candidate workspace — Events</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F7F7F5}
a{color:#0B5D3B}a:hover{color:#08442B}
</style>
</helmet>
<div style="font-family: 'Public Sans', system-ui, sans-serif; color: #13201A; background: #F7F7F5; min-height: 100vh; display: flex; flex-wrap: wrap">
<nav aria-label="Workspace" style="flex: 1 1 240px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E9E9E5; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #0B5D3B">Pamoja Party · Field plan</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px">[Candidate] for MP</span>
<span style="font-size: 13px; color: #4E5552">[Constituency], [County]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="8"><a href="{{n.href}}" style="{{n.style}}">{{n.label}}</a></sc-for>
</div>
<div style="margin-top: auto; padding: 0 8px; font-size: 13px; color: #4E5552">Powered by [Your product]</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Events</h1>
<div role="tablist" aria-label="When" style="display: flex; border: 1px solid #D3D5D3; border-radius: 999px; padding: 3px; background: #FFFFFF">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-label="Event list" style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{events}}" as="e" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E9E9E5; border-radius: 16px; padding: 20px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center">
<div style="flex: 0 0 64px; height: 72px; border-radius: 12px; background: #E7F0EA; color: #0B5D3B; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em">{{e.mon}}</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1">[00]</span>
</div>
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #0B5D3B">{{e.type}} · {{e.ward}}</span>
<h2 style="margin: 0; font-size: 18px; font-weight: 700">{{e.title}}</h2>
<span style="font-size: 14px; color: #4E5552">[Registration centre] · lead: [mobilizer]</span>
</div>
<div style="display: flex; gap: 20px; align-items: center">
<div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 12px; color: #4E5552">Invited</span><span style="font-weight: 800; font-size: 18px">[000]</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 12px; color: #4E5552">{{e.attLabel}}</span><span style="font-weight: 800; font-size: 18px">{{e.att}}</span></div>
<span style="{{e.pubStyle}}">{{e.pub}}</span>
</div>
</article>
</sc-for>
</section>

<section aria-labelledby="new-h" style="flex: 2 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E9E9E5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="new-h" style="margin: 0; font-size: 20px; font-weight: 700">Schedule an event</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Title<input type="text" placeholder="e.g. Town hall on water" style="font: inherit; font-weight: 400; font-size: 15px; padding: 11px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Type<select style="font: inherit; font-weight: 400; font-size: 15px; padding: 11px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px; background: #FFFFFF"><option>Town hall</option><option>Door-to-door</option><option>Rally</option><option>Market walk</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Ward<select style="font: inherit; font-weight: 400; font-size: 15px; padding: 11px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px; background: #FFFFFF"><option>[Ward 4]</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Date &amp; time<input type="datetime-local" style="font: inherit; font-weight: 400; font-size: 15px; padding: 10px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Lead mobilizer<select style="font: inherit; font-weight: 400; font-size: 15px; padding: 11px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px; background: #FFFFFF"><option>[Mobilizer]</option></select></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Venue / registration centre<input type="text" placeholder="[Registration centre]" style="font: inherit; font-weight: 400; font-size: 15px; padding: 11px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"></label>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #0B5D3B">Show on my public candidate profile</label>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #0B5D3B">SMS invite to supporters in this ward (opted-in only)</label>
<button type="button" style="font: inherit; font-weight: 700; font-size: 15px; color: #FFFFFF; background: #0B5D3B; border: 0; height: 46px; border-radius: 12px; cursor: pointer">Schedule event</button>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'Upcoming' }; }
  renderVals() {
    const S = this.state;
    const up = S.tab === 'Upcoming';
    const tabs = ['Upcoming', 'Past'].map((label) => ({ label, selected: S.tab === label ? 'true' : 'false', pick: () => this.setState({ tab: label }),
      style: 'font: inherit; font-size: 14px; font-weight: 700; min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer; ' + (S.tab === label ? 'background: #0B5D3B; color: #FFFFFF' : 'background: transparent; color: #13201A') }));
    const list = up
      ? [['NOV', 'Town hall', '[Ward 2]', '[Town hall on water]', true], ['NOV', 'Door-to-door', '[Ward 4]', '[Estate canvass, Block C]', false], ['DEC', 'Market walk', '[Ward 1]', '[Market walkabout]', true], ['DEC', 'Rally', '[Ward 3]', '[Constituency rally]', true]]
      : [['OCT', 'Town hall', '[Ward 1]', '[Youth forum]', true], ['OCT', 'Door-to-door', '[Ward 5]', '[Village canvass]', false]];
    const events = list.map((e) => ({ mon: e[0], type: e[1], ward: e[2], title: e[3], pub: e[4] ? 'Public' : 'Team only',
      pubStyle: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; ' + (e[4] ? 'background: #E3F1E8; color: #0B5D3B' : 'background: #F1F1ED; color: #3D4441'),
      attLabel: up ? 'RSVPs' : 'Attended', att: '[000]' }));
    const items = [['Strategy', 'Workspace.dc.html'], ['Targets & wards', 'WsTargets.dc.html'], ['Events', 'WsEvents.dc.html'], ['Mobilizers', 'WsMobilizers.dc.html'], ['Supporters', 'WsSupporters.dc.html'], ['Messages', 'WsMessages.dc.html'], ['Party feed & sharing', 'WsParty.dc.html'], ['Election-day agents', 'WsAgents.dc.html'], ['Spending', 'WsSpending.dc.html']];
    const nav = items.map((x) => ({ label: x[0], href: x[1], style: 'display: block; padding: 11px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; ' + (x[0] === 'Events' ? 'background: #E7F0EA; color: #0B5D3B' : 'color: #3D4441') }));
    return { nav, tabs, events };
  }
}
</script>
</body>
</html>
