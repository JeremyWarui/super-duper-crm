<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add sub-branch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F7F7F5}
a{color:#0B5D3B}a:hover{color:#08442B}
</style>
</helmet>
<div style="position: relative; min-height: 1000px; font-family: 'Public Sans', system-ui, sans-serif; color: #13201A; background: #F7F7F5; display: flex; flex-wrap: wrap">
<div aria-hidden="true" style="flex: 0 1 240px; background: #13201A; min-height: 1000px"></div>
<div aria-hidden="true" style="flex: 999 1 560px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="height: 36px; width: 240px; border-radius: 8px; background: #DDE1DE"></div>
<div style="height: 110px; border-radius: 16px; background: #FFFFFF"></div>
<div style="height: 520px; border-radius: 16px; background: #FFFFFF"></div>
</div>

<div style="position: absolute; inset: 0; background: rgba(19,32,26,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 56px 16px; box-sizing: border-box; overflow: auto">
<div role="dialog" aria-modal="true" aria-labelledby="dlg-h" style="width: 100%; max-width: 640px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 28px; border-bottom: 1px solid #F0F0EC">
<h2 id="dlg-h" style="margin: 0; font-size: 22px; font-weight: 700">{{title}}</h2>
<a href="CrmBranches.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #13201A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>

<sc-if value="{{form}}" hint-placeholder-val="{{ true }}">
<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span id="lvl" style="font-size: 14px; font-weight: 600">Level</span>
<div role="radiogroup" aria-labelledby="lvl" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="{{l.style}}"><strong>{{l.label}}</strong><span style="font-size: 13px; font-weight: 400; opacity: 0.85">{{l.hint}}</span></button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Parent branch<select style="font: inherit; font-weight: 400; font-size: 15px; padding: 12px; border: 1.5px solid #C9CCCF; border-radius: 10px; background: #FFFFFF"><option>Nakuru County</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">{{areaLabel}}<select style="font: inherit; font-weight: 400; font-size: 15px; padding: 12px; border: 1.5px solid #C9CCCF; border-radius: 10px; background: #FFFFFF"><option>{{areaOption}}</option></select><span style="font-size: 12px; font-weight: 400; color: #4E5552">Only areas without a sub-branch are listed (IEBC boundaries).</span></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Sub-branch name<input type="text" value="{{autoName}}" style="font: inherit; font-weight: 400; font-size: 15px; padding: 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"><span style="font-size: 12px; font-weight: 400; color: #4E5552">Filled in from the area; you can change it.</span></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Interim coordinator<input type="search" placeholder="Search members by name or no." style="font: inherit; font-weight: 400; font-size: 15px; padding: 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"><span style="font-size: 12px; font-weight: 400; color: #4E5552">Must be a verified member in this area.</span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Officials to be elected by<input type="date" style="font: inherit; font-weight: 400; font-size: 15px; padding: 11px 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Office address (optional)<input type="text" placeholder="Building, street, town" style="font: inherit; font-weight: 400; font-size: 15px; padding: 12px; border: 1.5px solid #C9CCCF; border-radius: 10px"></label>
<div style="background: #F7F7F5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<label style="display: flex; gap: 10px; align-items: center"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #0B5D3B">Move <strong>[000] existing members</strong> in this area into the new sub-branch</label>
<label style="display: flex; gap: 10px; align-items: center"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #0B5D3B">Notify county branch officials by SMS</label>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding: 18px 28px; border-top: 1px solid #F0F0EC">
<a href="CrmBranches.dc.html" style="font-weight: 700; font-size: 15px; color: #13201A; padding: 0 18px; height: 46px; display: flex; align-items: center; border: 1px solid #D3D5D3; border-radius: 12px; text-decoration: none">Cancel</a>
<button type="button" onClick="{{create}}" style="font: inherit; font-weight: 700; font-size: 15px; color: #FFFFFF; background: #0B5D3B; border: 0; height: 46px; padding: 0 20px; border-radius: 12px; cursor: pointer">Create sub-branch</button>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 14px; align-items: center">
<span style="flex: 0 0 48px; height: 48px; border-radius: 50%; background: #0B5D3B; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<p style="margin: 0; font-size: 17px; line-height: 1.5"><strong>{{autoName}}</strong> is set up under Nakuru County with [000] members moved in.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">Next steps</span>
<a href="FlowOfficials.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid #E9E9E5; border-radius: 12px; text-decoration: none; color: #13201A"><span><strong>Record officials</strong> — chair, secretary, treasurer</span><span style="color: #0B5D3B; font-weight: 700">→</span></a>
<a href="CrmComms.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid #E9E9E5; border-radius: 12px; text-decoration: none; color: #13201A"><span><strong>Invite members</strong> to the first meeting</span><span style="color: #0B5D3B; font-weight: 700">→</span></a>
</div>
<p style="margin: 0; font-size: 13px; color: #4E5552">Logged: created by [your name], [date, time].</p>
</div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lvl: 'Constituency', done: false }; }
  renderVals() {
    const S = this.state;
    const c = S.lvl === 'Constituency';
    const levels = [['Constituency', 'Covers all wards in one constituency'], ['Ward', 'Smaller unit under a constituency']].map((l) => ({ label: l[0], hint: l[1], checked: S.lvl === l[0] ? 'true' : 'false', pick: () => this.setState({ lvl: l[0] }),
      style: 'font: inherit; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; cursor: pointer; ' + (S.lvl === l[0] ? 'background: #E7F0EA; border: 2px solid #0B5D3B; color: #13201A' : 'background: #FFFFFF; border: 2px solid #E9E9E5; color: #13201A') }));
    return {
      levels, form: !S.done, done: S.done,
      title: S.done ? 'Sub-branch created' : 'Add a sub-branch',
      areaLabel: c ? 'Constituency' : 'Ward', areaOption: c ? '[Constituency] (no sub-branch yet)' : '[Ward], [Constituency]',
      autoName: c ? '[Constituency] Constituency Branch' : '[Ward] Ward Branch',
      create: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
