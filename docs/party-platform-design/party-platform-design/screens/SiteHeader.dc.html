<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Website header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: 'Public Sans', system-ui, sans-serif; color: #13201A; width: 100%">
<div style="background: #13201A; color: #C9CDCB; font-size: 13px">
<div style="max-width: 1240px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<span>Registered political party · Reg. No. [000] · Hotline [0700 000 000]</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div role="group" aria-label="Language" style="display: flex; gap: 2px">
<button type="button" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
<button type="button" onClick="{{setSw}}" style="{{swStyle}}">SW</button>
</div>
<sc-if value="{{signedIn}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; gap: 14px; align-items: center"><a href="MemberAccount.dc.html" style="color: #FFFFFF; font-weight: 600; padding: 8px 0">[First name] · My account</a><a href="SignIn.dc.html" style="color: #C9CDCB; padding: 8px 0">Sign out</a></span>
</sc-if>
<sc-if value="{{signedOut}}" hint-placeholder-val="{{ true }}">
<a href="SignIn.dc.html" style="color: #FFFFFF; font-weight: 600; padding: 8px 0">Sign in</a>
</sc-if>
</div>
</div>
</div>
<header style="background: rgba(255,255,255,0.82); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid rgba(19,32,26,0.06)">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
<a href="PartyHome.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #13201A">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #0B5D3B; display: flex; align-items: center; justify-content: center; color: #F2B705; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">P</span>
<span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Pamoja Party</span><span style="font-size: 12px; color: #4E5552; font-weight: 600">[Party slogan]</span></span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px 4px; font-weight: 600; font-size: 15px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="7"><a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.style}}">{{l.label}}</a></sc-for>
</nav>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="PartyHome.dc.html#contribute" style="font-weight: 700; font-size: 15px; color: #13201A; padding: 12px 18px; border: 1.5px solid #13201A; border-radius: 999px; text-decoration: none">Contribute</a>
<a href="Join.dc.html" style="font-weight: 700; font-size: 15px; color: #13201A; background: #F2B705; padding: 13px 20px; border-radius: 999px; text-decoration: none">Join the party</a>
</div>
</div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Home","About","Agenda & issues","News","Events","Candidates","Results","Counties","None"],"default":"Home"},"signedIn":{"editor":"boolean","default":false},"onLang":{"editor":null},"$preview":{"width":1440,"height":130}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en' }; }
  renderVals() {
    const active = this.props.active ?? 'Home';
    const signed = !!this.props.signedIn && this.props.signedIn !== 'false';
    const en = this.state.lang === 'en';
    const set = (l) => { this.setState({ lang: l }); if (typeof this.props.onLang === 'function') this.props.onLang(l); };
    const on = 'font: inherit; font-size: 12px; font-weight: 700; border: 0; border-radius: 6px; padding: 6px 10px; min-width: 36px; cursor: pointer; background: #F2B705; color: #13201A';
    const off = 'font: inherit; font-size: 12px; font-weight: 700; border: 0; border-radius: 6px; padding: 6px 10px; min-width: 36px; cursor: pointer; background: transparent; color: #E2E5E3';
    const links = [['About', 'PubAbout.dc.html'], ['Agenda & issues', 'PubIssue.dc.html'], ['News', 'News.dc.html'], ['Events', 'Events.dc.html'], ['Candidates', 'Candidates.dc.html'], ['Results', 'PubResults.dc.html'], ['Counties', 'PubBranch.dc.html']].map((l) => {
      const cur = l[0] === active;
      return { label: l[0], href: l[1], current: cur ? 'page' : 'false', style: 'text-decoration: none; padding: 9px 14px; border-radius: 999px; ' + (cur ? 'color: #0B5D3B; background: #E7F0EA' : 'color: #13201A') };
    });
    return { links, signedIn: signed, signedOut: !signed, enStyle: en ? on : off, swStyle: en ? off : on, setEn: () => set('en'), setSw: () => set('sw') };
  }
}
</script>
</body>
</html>
