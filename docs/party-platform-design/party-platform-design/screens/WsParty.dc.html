<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candidate workspace — Party feed &amp; sharing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F4F2}
a{color:#0B5D3B}a:hover{color:#08442B}
</style>
</helmet>
<div style="font-family: 'Public Sans', system-ui, sans-serif; color: #13201A; background: #F3F4F2; min-height: 100vh; display: flex; flex-wrap: wrap">
<nav aria-label="Workspace" style="flex: 1 1 240px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E1E4E2; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #0B5D3B">Pamoja Party · Field plan</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px">[Candidate] for MP</span>
<span style="font-size: 13px; color: #4B5751">[Constituency], [County]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="9"><a href="{{n.href}}" style="{{n.style}}">{{n.label}}</a></sc-for>
</div>
<div style="margin-top: auto; padding: 0 8px; font-size: 13px; color: #4B5751">Powered by [Your product]</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Party feed &amp; sharing</h1>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
<section aria-labelledby="f-h" style="flex: 3 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E4E2; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<h2 id="f-h" style="margin: 0; font-size: 20px; font-weight: 700">From the party</h2>
<div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>
</div>
<sc-for list="{{feed}}" as="i" hint-placeholder-count="5">
<article style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #EDEFEE">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 520px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #0B5D3B">{{i.kind}} · {{i.when}}</span><strong style="font-size: 16px">{{i.title}}</strong><span style="font-size: 14px; color: #4B5751">{{i.body}}</span></div>
<sc-if value="{{i.hasAct}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{i.act}}" style="{{i.btn}}">{{i.actLabel}}</button></sc-if>
</article>
</sc-for>
</section>

<aside style="flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<section aria-labelledby="s-h" style="background: #FFFFFF; border: 1px solid #E1E4E2; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h2 id="s-h" style="margin: 0; font-size: 20px; font-weight: 700">Sharing &amp; privacy</h2>
<sc-for list="{{shares}}" as="s" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #EDEFEE">
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">{{s.label}}</strong><span style="font-size: 13px; color: #4B5751">{{s.hint}}</span></div>
<button type="button" role="switch" aria-checked="{{s.checked}}" aria-label="{{s.label}}" onClick="{{s.toggle}}" style="{{s.track}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span></button>
</div>
</sc-for>
</section>
<section aria-labelledby="pv-h" style="background: #13201A; color: #F6F5F0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<h2 id="pv-h" style="margin: 0; font-size: 16px; font-weight: 700">What the party sees right now</h2>
<sc-for list="{{preview}}" as="p" hint-placeholder-count="2"><span style="font-size: 14px; color: #DDE3DF">• {{p}}</span></sc-for>
</section>
<section aria-labelledby="log-h" style="background: #FFFFFF; border: 1px solid #E1E4E2; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<h2 id="log-h" style="margin: 0 0 4px; font-size: 16px; font-weight: 700">Sharing history</h2>
<sc-for list="{{log}}" as="l" hint-placeholder-count="2"><span style="font-size: 13px; color: #3D4A43">{{l}}</span></sc-for>
</section>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'All', sh: { reach: true }, log: ['[date] · Event reach summary turned on by [Candidate]'], done: {} }; }
  renderVals() {
    const S = this.state;
    const items = [
      { id: 1, kind: 'Event', when: '[date]', title: 'Party rally in [Ward 2]', body: '[000] expected. Nominees may request a 5-minute slot.', act: 'Request a speaking slot' },
      { id: 2, kind: 'Members', when: 'this month', title: '[000] new party members in [Ward 4]', body: 'Counts only — member contacts are not shared with campaigns.', act: null },
      { id: 3, kind: 'Issues', when: '[date]', title: 'Top issue at party forums: [Issue]', body: 'Raised at [0] forums across your constituency.', act: 'Add to my talking points' },
      { id: 4, kind: 'Notice', when: '[date]', title: 'Nominee briefing on election-day agents', body: 'HQ training for all nominees, [date], online.', act: 'RSVP' },
      { id: 5, kind: 'Event', when: '[date]', title: 'Women’s league forum in [Ward 1]', body: 'Open to nominees and their teams.', act: 'Add to my events' }
    ];
    const kinds = { All: () => true, Events: (i) => i.kind === 'Event', Members: (i) => i.kind === 'Members', Notices: (i) => i.kind === 'Notice' || i.kind === 'Issues' };
    const filters = Object.keys(kinds).map((label) => ({ label, pressed: S.f === label ? 'true' : 'false', pick: () => this.setState({ f: label }),
      style: 'font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 0 14px; border-radius: 999px; cursor: pointer; ' + (S.f === label ? 'background: #13201A; color: #FFFFFF; border: 1px solid #13201A' : 'background: #FFFFFF; color: #13201A; border: 1px solid #D5D9D6') }));
    const feed = items.filter(kinds[S.f]).map((i) => { const d = !!S.done[i.id]; return { ...i, hasAct: !!i.act, actLabel: d ? 'Done ✓' : i.act, act: () => this.setState({ done: { ...S.done, [i.id]: true } }),
      btn: 'font: inherit; font-weight: 700; font-size: 14px; height: 40px; padding: 0 14px; border-radius: 10px; cursor: pointer; ' + (d ? 'background: #E7F0EA; color: #0B5D3B; border: 1px solid #0B5D3B' : 'background: #FFFFFF; color: #13201A; border: 1px solid #D5D9D6') }; });
    const defs = [['reach', 'Event reach summary', 'Totals invited vs attended'], ['map', 'Coverage map', 'Which wards have mobilizers'], ['counts', 'Supporter counts by ward', 'Numbers only, no names']];
    const sw = (on, lock) => 'flex: 0 0 50px; width: 50px; height: 28px; border-radius: 999px; border: 0; padding: 3px; display: flex; cursor: ' + (lock ? 'not-allowed' : 'pointer') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (lock ? '#E1E4E2' : on ? '#0B5D3B' : '#9AA49F');
    const shares = defs.map((d) => { const on = !!S.sh[d[0]]; return { label: d[1], hint: d[2], checked: on ? 'true' : 'false', track: sw(on, false),
      toggle: () => this.setState({ sh: { ...S.sh, [d[0]]: !on }, log: ['Just now · ' + d[1] + ' turned ' + (on ? 'off' : 'on') + ' by you'].concat(S.log) }) }; })
      .concat([{ label: 'Supporter list', hint: 'Always stays with your campaign', checked: 'false', track: sw(false, true), toggle: () => {} }]);
    const preview = defs.filter((d) => S.sh[d[0]]).map((d) => d[1]);
    const items2 = [['Strategy', 'Workspace.dc.html'], ['Targets & wards', 'WsTargets.dc.html'], ['Events', 'WsEvents.dc.html'], ['Mobilizers', 'WsMobilizers.dc.html'], ['Supporters', 'WsSupporters.dc.html'], ['Messages', 'WsMessages.dc.html'], ['Party feed & sharing', 'WsParty.dc.html'], ['Election-day agents', 'WsAgents.dc.html'], ['Spending', 'WsSpending.dc.html']];
    const nav = items2.map((x) => ({ label: x[0], href: x[1], style: 'display: block; padding: 11px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; ' + (x[0] === 'Party feed & sharing' ? 'background: #E7F0EA; color: #0B5D3B' : 'color: #3D4A43') }));
    return { nav, filters, feed, shares, preview: preview.length ? preview : ['Nothing — the party sees only that you have a workspace'], log: S.log };
  }
}
</script>
</body>
</html>
